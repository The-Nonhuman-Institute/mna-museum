# Auto-deploy The Commons to Vercel on every push to master.
#
# Mirrors deploy-website.yml but targets the mna-commons Vercel
# project. Lives alongside the website workflow rather than as a
# matrix job because the two have different path filters and
# slightly different build commands.
#
# Required repo secrets:
#   VERCEL_TOKEN              — shared with deploy-website
#   VERCEL_ORG_ID             — shared with deploy-website
#   COMMONS_VERCEL_PROJECT_ID — prj_u22uRaoOTc3tU1FaMWZoUmlCCwy3
#                                (mna-commons project)

name: deploy-commons

on:
  push:
    branches: [master]
    paths:
      - "commons/**"
      - ".github/workflows/deploy-commons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.COMMONS_VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify mnamuseum@gmail.com
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject_line="$(echo "$COMMIT_SUBJECT" | head -n1)"
          if [ "$STATUS" = "success" ]; then
            emoji="✅"; tag="Deployed"
          else
            emoji="❌"; tag="Deploy failed"
          fi
          json=$(jq -n \
            --arg from "MNA Build <registry@mnamuseum.org>" \
            --arg to "mnamuseum@gmail.com" \
            --arg subject "$emoji $tag · commons · $subject_line" \
            --arg html "<p><strong>$tag</strong> — commons</p><p><em>${subject_line}</em></p><p>Commit: <code>${COMMIT_SHA:0:7}</code><br/>Deploy: <a href='${DEPLOY_URL}'>${DEPLOY_URL}</a><br/>Run: <a href='${RUN_URL}'>workflow log</a></p>" \
            '{from:$from,to:[$to],subject:$subject,html:$html}')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$json" > /dev/null
