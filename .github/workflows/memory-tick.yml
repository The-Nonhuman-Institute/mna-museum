# memory-tick — MNA-GOV-004 Agent Memory write worker
#
# Runs every 15 minutes. For each founding agent, polls the events
# table for new entries (since their high-water mark) and writes
# first-person memories via Haiku. Bounded to 10 events per agent
# per tick to keep latency + Haiku spend predictable. Backfills
# happen out-of-band via `npx tsx system/scripts/memory-tick.ts
# --backfill`.
#
# Required repo secrets:
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   ANTHROPIC_API_KEY

name: memory-tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: system/package-lock.json

      - name: Install system deps
        working-directory: system
        run: npm ci

      - name: Run memory-tick
        working-directory: ${{ github.workspace }}
        run: npx tsx system/scripts/memory-tick.ts
