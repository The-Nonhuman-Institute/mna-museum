# Ceremony orchestrator — GitHub Actions cron.
#
# Runs system/scripts/ceremonies-tick.ts every 15 minutes. The
# orchestrator opens ceremonies whose scheduled_at falls inside the
# current window, closes ceremonies whose duration has elapsed, and
# spawns headless presence for invited agents so they actually appear
# in the museum at the ceremony's gallery.
#
# Designed to fail safely: agents are *invited*, not commanded.
# Failure to attend leaves the invitation as institutional record.
#
# Cadence: every 15 minutes. The orchestrator itself makes no
# Anthropic API calls — cost is dominated by the museum visits it
# fans out (each visit is presence-only, also $0). The fixed cost is
# the GitHub Actions minutes, well within the free tier.
#
# Required repo secrets:
#   TURSO_DATABASE_URL    — main institutional DB
#   TURSO_AUTH_TOKEN

name: ceremonies

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceremonies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: system/package-lock.json

      - name: Install system deps
        working-directory: system
        run: npm ci

      - name: Run ceremony orchestrator
        working-directory: ${{ github.workspace }}
        run: npx tsx system/scripts/ceremonies-tick.ts
