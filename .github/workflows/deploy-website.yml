# Auto-deploy the MNA website to Vercel on every push to master.
#
# Why this exists: Vercel's GitHub App integration is currently
# broken for this repo (every push lands without triggering a
# deploy). Rather than rely on a flaky UI-mediated integration,
# this workflow calls the Vercel CLI directly using a token stored
# in repo secrets. Result: `git push origin master` always lands on
# www.mnamuseum.org within ~2 minutes, no manual `vercel --prod`.
#
# Required repo secrets:
#   VERCEL_TOKEN       — personal token from
#                         https://vercel.com/account/tokens
#                         (scope: full account; lifetime: as long
#                         as you can)
#   VERCEL_ORG_ID      — team_dFBFL5GvfoVdRy6ZwC8k6CPx  (U3 Labs)
#   VERCEL_PROJECT_ID  — prj_Gen9OH2yaqpdh13AV7CYMgJgYKDp (website)
#
# The org and project IDs aren't actually secret (they're visible
# in any deployment URL) but Vercel's CLI expects them as env vars
# and putting them in secrets keeps the workflow file portable.

name: deploy-website

on:
  push:
    branches: [master]
    # Skip pure-system or pure-CI changes that don't affect the
    # public site. Saves Vercel build minutes and our own time.
    paths:
      - "website/**"
      - "founding-documents/**"
      - "party/**"
      - "package.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deploy source-only. Vercel builds on their own infrastructure
      # (Pro plan = 8 GB / 4 cores + persistent .next/cache), not on
      # this GHA runner. ~60-90s typical, faster after cache warms.
      # No `vercel pull` + `vercel build` needed when Vercel does both.
      #
      # Important: capture vercel's exit code so the step actually
      # fails when the deploy fails. The previous form ran vercel
      # inside $(...) which swallowed the exit code and made the
      # notify step send "✅ Deployed" on bad-token / quota errors.
      - name: Deploy to production (Vercel builds remotely)
        id: deploy
        run: |
          set -o pipefail
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel-deploy.out
          url="$(tail -1 /tmp/vercel-deploy.out)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Notify on completion so the user doesn't have to poll the
      # Vercel dashboard. Fires on both success and failure (the `if`
      # uses always() so failures still send). Resend sends from
      # registry@mnamuseum.org to mnamuseum@gmail.com.
      - name: Notify mnamuseum@gmail.com
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject_line="$(echo "$COMMIT_SUBJECT" | head -n1)"
          if [ "$STATUS" = "success" ]; then
            emoji="✅"; tag="Deployed"
          else
            emoji="❌"; tag="Deploy failed"
          fi
          json=$(jq -n \
            --arg from "MNA Build <registry@mnamuseum.org>" \
            --arg to "mnamuseum@gmail.com" \
            --arg subject "$emoji $tag · website · $subject_line" \
            --arg html "<p><strong>$tag</strong> — website</p><p><em>${subject_line}</em></p><p>Commit: <code>${COMMIT_SHA:0:7}</code><br/>Deploy: <a href='${DEPLOY_URL}'>${DEPLOY_URL}</a><br/>Run: <a href='${RUN_URL}'>workflow log</a></p>" \
            '{from:$from,to:[$to],subject:$subject,html:$html}')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$json" > /dev/null
